# Render Blueprint for Learn Accounting (Free-Tier Configuration)
# IMPORTANT: Do NOT deploy or provision automatically without stakeholder approval.
#
# COST & FREE-TIER DATABASE WARNING:
# - Both the Web Service and PostgreSQL database below use Render's FREE plan (`plan: free`).
# - Render Free PostgreSQL databases EXPIRE after 30 days and are deleted unless upgraded or migrated.
# - Render Free PostgreSQL does NOT provide permanent storage guarantees or automated backups.
# - Always export backups (`pg_dump`) before the 30-day limit if retaining student data.

databases:
  - name: learn-accounting-db
    databaseName: learn_accounting
    user: learn_accounting_user
    plan: free
    region: singapore

services:
  - type: web
    name: learn-accounting
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_USER
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learn-accounting-db
          property: connectionString
